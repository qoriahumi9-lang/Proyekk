<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Toko Sepatu POS</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin: 0; padding: 0;">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        const products = [
            { id: 1, name: "Nike Air Max", price: 1200000, emoji: "👟" },
            { id: 2, name: "Adidas Ultraboost", price: 1500000, emoji: "🏃" },
            { id: 3, name: "Puma Sport", price: 900000, emoji: "⚡" },
            { id: 4, name: "Converse Classic", price: 750000, emoji: "⭐" },
            { id: 5, name: "Vans Old Skool", price: 850000, emoji: "🎿" },
            { id: 6, name: "New Balance 574", price: 1100000, emoji: "🔵" },
        ];

        const fmt = (n) => "Rp " + n.toLocaleString("id-ID");

        function ShoeStorePOS() {
            const [cart, setCart] = useState([]);
            const [paid, setPaid] = useState("");
            const [saved, setSaved] = useState(false);

            const addToCart = (product) => {
                setSaved(false);
                setCart((prev) => {
                    const exists = prev.find((i) => i.id === product.id);
                    return exists
                        ? prev.map((i) => i.id === product.id ? { ...i, qty: i.qty + 1 } : i)
                        : [...prev, { ...product, qty: 1 }];
                });
            };

            const changeQty = (id, delta) => {
                setCart((prev) =>
                    prev.map((i) => i.id === id ? { ...i, qty: i.qty + delta } : i)
                        .filter((i) => i.qty > 0)
                );
            };

            const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
            const paidNum = Number(paid) || 0;
            const change = paidNum - total;
            const canSave = cart.length > 0 && paidNum >= total;

            const handleSave = () => {
                if (!canSave) return;
                setSaved(true);
                setCart([]);
                setPaid("");
            };

            // Menggunakan template string untuk CSS agar tetap bersih
            return (
                <div style={{ minHeight: "100vh", background: "#0f0f0f", fontFamily: "'DM Mono', monospace", color: "#f5f0e8" }}>
                    <style>{`
                        .pos-grid { display: grid; grid-template-columns: 1fr 340px; height: 100vh; max-width: 1200px; margin: 0 auto; }
                        .header { grid-column: 1 / -1; padding: 24px 32px; border-bottom: 1px solid #2a2a2a; display: flex; align-items: baseline; gap: 16px; }
                        .product-card { background: #181818; border: 1px solid #222; padding: 16px; cursor: pointer; border-radius: 4px; }
                        .product-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 24px; }
                        .cart-panel { background: #111; padding: 24px; display: flex; flex-direction: column; }
                        .qty-btn { background: #1a1a1a; border: 1px solid #333; color: #fff; cursor: pointer; padding: 2px 8px; }
                        .save-btn { padding: 12px; background: ${canSave ? "#c8a96e" : "#333"}; border: none; cursor: ${canSave ? "pointer" : "not-allowed"}; color: #000; width: 100%; }
                    `}</style>

                    {saved && <div style={{position:'fixed', top:20, background:'#6dbb8a', padding:10, width:'100%', textAlign:'center'}}>Transaksi berhasil!</div>}
                    
                    <div className="pos-grid">
                        <header className="header">
                            <h1>Kasir</h1> <span>Toko Sepatu</span>
                        </header>
                        <main>
                            <div className="product-grid">
                                {products.map(p => (
                                    <div key={p.id} className="product-card" onClick={() => addToCart(p)}>
                                        <div>{p.emoji}</div>
                                        <div>{p.name}</div>
                                        <div>{fmt(p.price)}</div>
                                    </div>
                                ))}
                            </div>
                        </main>
                        <aside className="cart-panel">
                            <h3>Keranjang</h3>
                            {cart.map(i => (
                                <div key={i.id} style={{display:'flex', justifyContent:'space-between', marginBottom:10}}>
                                    {i.name} x {i.qty}
                                    <button className="qty-btn" onClick={() => changeQty(i.id, -1)}>-</button>
                                </div>
                            ))}
                            <hr />
                            <p>Total: {fmt(total)}</p>
                            <input type="number" placeholder="Bayar" onChange={(e) => setPaid(e.target.value)} value={paid} style={{width:'100%', padding:8}} />
                            <p>Kembalian: {paidNum > 0 ? fmt(Math.max(0, change)) : "-"}</p>
                            <button className="save-btn" onClick={handleSave}>Simpan Transaksi</button>
                        </aside>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ShoeStorePOS />);
    </script>
</body>
</html>
